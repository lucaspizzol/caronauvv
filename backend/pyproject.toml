[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caronauvv"
version = "0.1.0"
description = "Plataforma de caronas entre alunos da UVV, com Flask (API) e Vue 3."
requires-python = ">=3.10"
authors = [
    {name = "Kaua Araujo de Souza"},
    {name = "Lucas Pizzol"},
]
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-CORS>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",          # validacao dos formularios no servidor (schemas)
]

[project.optional-dependencies]
# PostgreSQL (producao): pip install -e .[postgres] e defina DATABASE_URL no .env
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "ipython",
    "flask-shell-ipython",
    "invoke",
]
test = [
    "pytest >= 8.3",
    "pytest-cov >= 5.0",
    "pytest-flask",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    # o SQLite em memoria fecha a conexao no fim de cada teste; o aviso nao indica erro
    "ignore::ResourceWarning",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "instance*", "migrations*"]
